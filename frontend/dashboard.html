<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotizer - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-music"></i>
                <h1>Spotizer</h1>
            </div>

            <nav class="nav-menu">
                <a href="#" class="nav-item active" data-page="search">
                    <i class="fas fa-search"></i>
                    <span>Search</span>
                </a>
                <a href="#" class="nav-item" data-page="playlists">
                    <i class="fas fa-list"></i>
                    <span>My Playlists</span>
                </a>
                <a href="#" class="nav-item" data-page="history">
                    <i class="fas fa-history"></i>
                    <span>Download History</span>
                </a>
                <a href="#" class="nav-item" data-page="settings">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="user-info">
                <div class="user-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="user-details">
                    <span id="user-name">Loading...</span>
                    <small id="user-username">@username</small>
                </div>
                <button onclick="logout()" class="btn-logout" title="Logout">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Search Page -->
            <section id="page-search" class="page active">
                <h2>Search Music</h2>

                <div class="search-box">
                    <div class="search-input-group">
                        <input type="text" id="search-input" placeholder="Search for songs, albums, artists...">
                        <select id="search-type">
                            <option value="track">Tracks</option>
                            <option value="album">Albums</option>
                            <option value="artist">Artists</option>
                            <option value="playlist">Playlists</option>
                        </select>
                        <button onclick="performSearch()" class="btn btn-primary">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>

                <div id="search-results" class="results-grid">
                    <p class="placeholder-text">Search for your favorite music</p>
                </div>
            </section>

            <!-- Playlists Page -->
            <section id="page-playlists" class="page">
                <div class="page-header">
                    <h2>My Playlists</h2>
                    <button onclick="showCreatePlaylist()" class="btn btn-primary">
                        <i class="fas fa-plus"></i> New Playlist
                    </button>
                </div>

                <div id="playlists-list" class="playlists-grid">
                    <p class="placeholder-text">Loading playlists...</p>
                </div>
            </section>

            <!-- History Page -->
            <section id="page-history" class="page">
                <h2>Download History</h2>

                <div id="history-list" class="history-list">
                    <p class="placeholder-text">Loading history...</p>
                </div>
            </section>

            <!-- Settings Page -->
            <section id="page-settings" class="page">
                <h2>Settings</h2>

                <div class="settings-form">
                    <div class="setting-group">
                        <label>Download Quality</label>
                        <select id="setting-quality">
                            <option value="MP3_128">MP3 128kbps</option>
                            <option value="MP3_320" selected>MP3 320kbps</option>
                            <option value="FLAC">FLAC (Lossless)</option>
                        </select>
                    </div>

                    <div class="setting-group">
                        <label>
                            <input type="checkbox" id="setting-zip" checked>
                            Download as ZIP (for albums/playlists)
                        </label>
                    </div>

                    <div class="setting-group">
                        <label>Language</label>
                        <select id="setting-language">
                            <option value="en" selected>English</option>
                            <option value="fa">Persian</option>
                        </select>
                    </div>

                    <button onclick="saveSettings()" class="btn btn-primary">
                        <i class="fas fa-save"></i> Save Settings
                    </button>
                </div>
            </section>

            <!-- Detail Page (for track/album/artist) -->
            <section id="page-detail" class="page">
                <div class="detail-header">
                    <button onclick="goBackToSearch()" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Back
                    </button>
                </div>
                <div id="detail-content" class="detail-content">
                    <!-- Filled by JS -->
                </div>
            </section>
        </main>
    </div>

    <!-- Create Playlist Modal -->
    <div id="modal-create-playlist" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Create New Playlist</h3>
                <button onclick="closeModal('modal-create-playlist')" class="btn-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Playlist Name</label>
                    <input type="text" id="playlist-name" placeholder="My Awesome Playlist">
                </div>
                <div class="form-group">
                    <label>Description (optional)</label>
                    <textarea id="playlist-description" placeholder="Describe your playlist..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button onclick="closeModal('modal-create-playlist')" class="btn btn-secondary">Cancel</button>
                <button onclick="createPlaylist()" class="btn btn-primary">Create</button>
            </div>
        </div>
    </div>

    <!-- Track Detail Modal -->
    <div id="modal-track-detail" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="track-detail-title">Track Details</h3>
                <button onclick="closeModal('modal-track-detail')" class="btn-close">&times;</button>
            </div>
            <div class="modal-body" id="track-detail-content">
                <!-- Filled by JS -->
            </div>
        </div>
    </div>

    <!-- Audio Player Bar -->
    <div id="audio-player-bar" class="audio-player-bar hidden">
        <audio id="audio-element"></audio>

        <div class="player-track-info">
            <div class="player-cover">
                <img id="player-cover-img" src="" alt="">
                <i class="fas fa-music"></i>
            </div>
            <div class="player-text">
                <div id="player-track-title" class="player-title">No track playing</div>
                <div id="player-track-artist" class="player-artist">-</div>
            </div>
        </div>

        <div class="player-controls">
            <div class="player-buttons">
                <button id="player-prev" class="player-btn" title="Previous">
                    <i class="fas fa-step-backward"></i>
                </button>
                <button id="player-play-pause" class="player-btn player-btn-main" title="Play/Pause">
                    <i class="fas fa-play"></i>
                </button>
                <button id="player-next" class="player-btn" title="Next">
                    <i class="fas fa-step-forward"></i>
                </button>
            </div>
            <div class="player-progress">
                <span id="player-current-time" class="player-time">0:00</span>
                <div class="player-progress-bar">
                    <input type="range" id="player-seek" min="0" max="100" value="0">
                    <div id="player-progress-fill" class="player-progress-fill"></div>
                </div>
                <span id="player-duration" class="player-time">0:00</span>
            </div>
        </div>

        <div class="player-volume">
            <button id="player-queue-btn" class="player-btn" title="Queue">
                <i class="fas fa-list"></i>
            </button>
            <button id="player-mute" class="player-btn" title="Mute">
                <i class="fas fa-volume-up"></i>
            </button>
            <div class="volume-slider">
                <input type="range" id="player-volume" min="0" max="100" value="80">
            </div>
        </div>

        <!-- Queue Panel (slides up) -->
        <div id="queue-panel" class="queue-panel hidden">
            <div class="queue-header">
                <h3>Queue</h3>
                <button id="queue-close-btn" class="player-btn" title="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="queue-list" class="queue-list">
                <p class="placeholder-text">No tracks in queue</p>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
