<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotizer - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <i class="fas fa-music"></i>
                <h1>Spotizer</h1>
            </div>
            <p class="tagline">Download your favorite music from Spotify & Deezer</p>

            <div class="login-methods">
                <h3>Login to continue</h3>

                <!-- Telegram Login Widget Placeholder -->
                <div id="telegram-login">
                    <!-- Replace YOUR_BOT_USERNAME with your actual bot username -->
                    <script async src="https://telegram.org/js/telegram-widget.js?22"
                            data-telegram-login="Spotizer_bot"
                            data-size="large"
                            data-radius="8"
                            data-onauth="onTelegramAuth(user)"
                            data-request-access="write">
                    </script>
                </div>

                <!-- Fallback/Demo button for testing -->
                <div class="demo-login">
                    <p>Or try demo mode:</p>
                    <button onclick="demoLogin()" class="btn btn-secondary">
                        <i class="fas fa-user"></i> Demo Login
                    </button>
                </div>
            </div>

            <div class="features">
                <div class="feature">
                    <i class="fas fa-search"></i>
                    <span>Search Music</span>
                </div>
                <div class="feature">
                    <i class="fas fa-download"></i>
                    <span>Download Tracks</span>
                </div>
                <div class="feature">
                    <i class="fas fa-list"></i>
                    <span>Create Playlists</span>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
